<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Amaso Driver</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          sans-serif;
        font-size: 13px;
        margin: 0;
        padding: 12px;
        width: 300px;
      }
      h1 {
        font-size: 13px;
        font-weight: 600;
        margin: 0 0 10px;
        letter-spacing: 0.02em;
      }
      .row {
        margin: 10px 0;
      }
      label {
        display: block;
        font-size: 11px;
        color: #666;
        margin-bottom: 4px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
      }
      button {
        font-size: 12px;
        padding: 5px 10px;
        margin-right: 6px;
        cursor: pointer;
        border: 1px solid #ccc;
        background: #f7f7f7;
        border-radius: 4px;
      }
      button:hover {
        background: #efefef;
      }
      .status {
        font-size: 12px;
        padding: 8px 10px;
        border-radius: 4px;
        background: #f3f3f3;
        margin: 6px 0;
        line-height: 1.35;
      }
      .status.ok {
        background: #e6f7e6;
        color: #1a661a;
      }
      .status.bad {
        background: #fbe9e9;
        color: #7a1a1a;
      }
      .muted {
        color: #888;
        font-size: 11px;
        line-height: 1.4;
      }
      .origin {
        font-size: 11px;
        color: #666;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
    </style>
  </head>
  <body>
    <h1>Amaso Driver</h1>

    <div id="status" class="status">checking...</div>
    <div class="origin" id="origin-line">connected to: ...</div>

    <div class="row">
      <button id="reconnect">Reconnect</button>
    </div>

    <div class="row">
      <label>Driver tab</label>
      <div id="tab-info" class="muted">...</div>
      <div style="margin-top: 6px">
        <button id="use-current">Use this tab</button>
      </div>
    </div>

    <div class="muted">
      The driver authenticates with the same session cookie as the dashboard
      tab. If the connection fails, log in to the dashboard in this browser.
    </div>

    <script src="popup.js"></script>
  </body>
</html>
